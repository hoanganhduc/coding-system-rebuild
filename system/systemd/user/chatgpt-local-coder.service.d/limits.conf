# Crash-loop and heap limits.
#
# StartLimitBurst: on 2026-08-12 an orphaned child held ports 3000/3001 after a
# heap OOM, so every restart hit assertPortsFree -> UsageError -> exit 2. With
# RestartSec=5 and no burst limit set, systemd retried 2985 times over 4h21m
# instead of giving up. These values make that failure visible within ~25s.
#
# NODE_OPTIONS: the two OOMs hit V8's default ~4GB old-space cap after 14h and
# 22h uptime. Host has 23GB total / 18GB available, so 8GB is safe headroom.
# This delays the OOM, it does not fix the growth.
#
# MCP_SESSION_TTL_MS: this is the growth. ChatGPT opens a new MCP session per
# tool call and never sends DELETE (1159 initialized vs 3 removed in one log),
# and each session builds a full McpServer with the whole tool registry. The
# 24h default therefore retains a full day of dead sessions. 30min is far above
# any real call now that every timeout is capped at 90s, and the cleanup sweep
# closes the transport before dropping the entry (mcp-session-manager.ts:531),
# so eviction actually reclaims.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Environment="NODE_OPTIONS=--max-old-space-size=8192"
Environment="MCP_SESSION_TTL_MS=1800000"
