# agent_delegate resolves its CLIs with a plain PATH lookup against the
# service environment, while run_command resolves through 'bash -lc' and so
# sees the login PATH. Under a systemd user unit those two differ: the unit
# inherits only the system PATH, so claude, grok and opencode were reported
# "not on PATH" by agent_delegate even though run_command could run them.
# This is the login PATH, deduplicated.
[Service]
Environment="PATH={{ HOME }}/.local/bin:{{ HOME }}/.npm-global/bin:{{ HOME }}/OpenGauss/venv/bin:{{ HOME }}/.elan/bin:{{ HOME }}/.claude/plugins/cache/lean4-skills/lean4/4.6.1/bin:{{ HOME }}/.kimi-code/bin:{{ HOME }}/.grok/bin:{{ HOME }}/.bun/bin:{{ HOME }}/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin:{{ HOME }}/.claude/plugins/cache/lean4-skills/lean4/4.6.2/bin"
