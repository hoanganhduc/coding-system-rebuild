# Survive an interrupted startup migration.
#
# Startup migrations hold a lease in state_leases (scope=startup-migrations)
# with a 5 min TTL. If the gateway is killed mid-migration -- which is what an
# update does -- every restart fails until that lease expires. The stock unit
# allows 5 tries in 60s (~25s total), so systemd always gave up first and left
# the service in `failed` until someone intervened manually.
#
# 20 tries x 30s = 10 min of retry window, which outlives the 5 min lease, so
# the gateway self-recovers. The cap is deliberately kept so a genuinely broken
# install (e.g. a Node version below the engine requirement) still surfaces as
# `failed` instead of crash-looping forever.

[Unit]
StartLimitBurst=20
StartLimitIntervalSec=600

[Service]
RestartSec=30
