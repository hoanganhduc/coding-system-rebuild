# Secrets manifest — NAMES AND PATHS ONLY, never values. Safe to publish.
# Authority/session/private-state entries with backup:true are encrypted into a
# recovery set. Projection entries are regenerated from their named authority
# and are deliberately excluded from archives so copies cannot drift.
#
# Fields: path ($HOME-relative; trailing / = tree; * = glob), mode, required,
# classification, authority, portability, backup, feature, obtain, and the
# optional legacy_import synthesis policy. `generated` is created from bounded
# legacy inputs during import; `destination-authority` is supplied by the
# destination and must match a repository-pinned public trust root. Entries
# without an explicit id receive a stable path-derived id during validation.
schema: coding-system.secrets-manifest.v2
entry_defaults:
  classification: authority
  portability: portable
  backup: true
dir_perms:
  .ssh: "0700"
  .config/coding-system: "0700"
  .config/send-email: "0700"
  .config/ai-agents-skills: "0700"
  .config/ai-agents-skills/providers: "0700"
  .config/ai-agents-skills/zotero: "0700"
  .config/ai-agents-skills/calibre: "0700"
  .local/state/ai-agents-skills: "0700"
  .local/state/ai-agents-skills/file-delivery-replay: "0700"
  .config/getscipapers: "0700"
  .config/remote-bridge: "0700"
  .config/vnu-eoffice: "0700"
  .config/course: "0700"
  .config/course/google-classroom: "0700"
  .config/course/canvas: "0700"
  .config/course/classroom50: "0700"
  .config/.wrangler: "0700"
  .config/.wrangler/config: "0700"
  .kaggle: "0700"
  .config/gcloud: "0700"
  .aws: "0700"
  .kimi-code: "0700"
  .local/share/opencode: "0700"
  .local/share/forms-private-keys: "0700"
  .local/share/pki: "0700"
  .local/share/pki/nssdb: "0700"
  .copilot: "0700"
  .gemini: "0700"
  .openclaw: "0700"
  .openclaw/state: "0700"
  .openclaw/credentials: "0700"
  .openclaw/devices: "0700"
  .openclaw/identity: "0700"
  .openclaw/workspace/secrets: "0700"
  .openclaw/workspace/secrets/vnu-eoffice: "0700"
  .openclaw/workspace/.config/ai-agents-skills: "0700"
  .openclaw/workspace/.config/ai-agents-skills/providers: "0700"
  .openclaw/workspace/.config/file-delivery: "0700"
  .openclaw/workspace/.config/getscipapers: "0700"
  .openclaw/workspace/.config/remote-bridge: "0700"
  .openclaw/workspace/.config/send-email: "0700"
  .openclaw/workspace/.config/course/canvas: "0700"
  .config/chatgpt-local-coder: "0700"
  .config/chatgpt-local-coder/secret-refs: "0700"
  .config/chatgpt-local-coder/tunnel-profiles: "0700"
  .codewhale/secrets: "0700"
  .deepseek/secrets: "0700"
  .local/state/grok-proxy/iphone: "0700"

entries:
  # ---- SSH / git / GitHub -------------------------------------------------
  - {path: .ssh/id_rsa,            mode: "0600", required: true,
     feature: "git push over SSH; all hoanganhduc repo access",
     obtain: "existing key, or ssh-keygen + add at github.com/settings/keys"}
  - {path: .ssh/id_rsa.pub,        mode: "0644", required: true,
     feature: "SSH public key", obtain: "pairs with id_rsa"}
  - {path: .ssh/kit_rsa,           mode: "0600", required: false,
     feature: "secondary host identity", obtain: "existing key"}
  - {path: .ssh/kit_rsa.pub,       mode: "0644", required: false,
     feature: "secondary host identity", obtain: "pairs with kit_rsa"}
  - {path: .ssh/aws-ubuntu.pem,    mode: "0400", required: false,
     feature: "AWS instance access", obtain: "AWS console key pair"}
  - {path: .ssh/config,            mode: "0644", required: false,
     feature: "ssh host aliases", obtain: "captured from live system"}
  - {path: .ssh/authorized_keys,   mode: "0600", required: false,
     feature: "inbound ssh to this machine", obtain: "captured"}
  - {path: .ssh/known_hosts,       mode: "0644", required: false,
     feature: "ssh host verification", obtain: "regenerates on connect"}
  - {path: .gnupg/,                mode: "0700", required: false,
     exclude: [random_seed, "S.*", ".#*"],
     feature: "GnuPG keyring — PGP private key for send-email signing (also used by
       the OpenClaw host signing queue). Backed up encrypted, like the .ssh keys.",
     obtain: "import your existing secret key, or gpg --full-generate-key"}
  - {path: .gitconfig,             mode: "0644", required: true,
     feature: "git identity + gh credential helper wiring",
     obtain: "captured; new user sets user.name/email"}
  - {id: github-cli-hosts-authority,
     path: .config/gh/hosts.yml,   mode: "0600", required: true,
     classification: authority, portability: reauth-required,
     feature: "gh CLI auth; HTTPS git pushes; GitHub MCP",
     obtain: "gh auth login"}
  - {id: github-cli-config-authority,
     path: .config/gh/config.yml,  mode: "0600", required: false,
     feature: "gh CLI preferences (git_protocol, editor, aliases, pager) — restores
       identical gh behavior; non-secret personal state",
     obtain: "captured; gh recreates defaults, or `gh config set <key> <value>`"}
  - {id: openclaw-github-cli-hosts-projection,
     path: .openclaw/workspace/.config/gh/hosts.yml, mode: "0600", required: false,
     classification: projection, authority: github-cli-hosts-authority,
     portability: regenerated, backup: false,
     feature: "OpenClaw sandbox GitHub CLI authentication projection",
     obtain: "materialized from the canonical gh CLI hosts authority"}
  - {id: openclaw-github-cli-config-projection,
     path: .openclaw/workspace/.config/gh/config.yml, mode: "0600", required: false,
     classification: projection, authority: github-cli-config-authority,
     portability: regenerated, backup: false,
     feature: "OpenClaw sandbox GitHub CLI preference projection",
     obtain: "materialized from the canonical gh CLI config authority"}

  # ---- infra tokens -------------------------------------------------------
  - {path: .docker/config.json,    mode: "0600", required: false,
     feature: "registry logins (ghcr.io) for private image pulls — not present on the
       source machine today; create via `docker login ghcr.io` if images go private",
     obtain: "docker login ghcr.io with a GitHub PAT (read:packages)"}
  - {path: .docker/.token_seed, mode: "0600", required: false,
     classification: session, portability: reauth-required,
     feature: "Docker CLI credential-store token seed",
     obtain: "regenerated by Docker login when absent"}
  - {path: .docker/.token_seed.lock, mode: "0600", required: false,
     classification: private-state, portability: regenerated, backup: false,
     feature: "derived Docker credential-store lock", obtain: "regenerated by Docker"}
  - {path: .npmrc, mode: "0600", required: false,
     feature: "npm registry authentication for private packages",
     obtain: "npm login or a scoped registry token"}
  - {path: .netrc, mode: "0600", required: false,
     feature: "explicit CLI HTTP credentials when configured",
     obtain: "per-service account; omit when unused"}
  - {id: wrangler-oauth-session,
     path: .config/.wrangler/config/default.toml, mode: "0600", required: false,
     classification: session, portability: reauth-required, backup: true,
     feature: "Cloudflare Wrangler OAuth access/refresh session; logs and generated diagnostics are deliberately excluded",
     obtain: "wrangler login"}
  - {path: .aws/credentials, mode: "0600", required: false,
     feature: "AWS CLI/profile credentials",
     obtain: "aws configure or an external identity provider"}
  - {path: .config/gcloud/application_default_credentials.json, mode: "0600", required: false,
     classification: session, portability: reauth-required,
     feature: "Google application-default OAuth credentials used by research tooling",
     obtain: "gcloud auth application-default login"}
  - {path: .config/rclone/rclone.conf, mode: "0600", required: false,
     feature: "rclone remotes (Drive/WebDAV sync)", obtain: "rclone config"}
  - {id: modal-credentials,
     path: .modal.toml,            mode: "0600", required: false,
     feature: "modal-research-compute broker", obtain: "modal token new"}
  - {id: tailscale-authkey-authority,
     path: .config/coding-system/tailscale-authkey, mode: "0600", required: false,
     classification: authority, portability: portable, backup: true,
     feature: "raw Tailscale auth key consumed only through `tailscale up --auth-key=file:<path>`",
     obtain: "login.tailscale.com/admin/settings/keys — reusable auth key"}
  - {id: tailscale-hostname-setting,
     path: .config/coding-system/tailscale-hostname, mode: "0600", required: false,
     classification: private-state, portability: portable, backup: true,
     feature: "nonsecret restored-node hostname kept separate from the auth-key authority",
     obtain: "bin/setup-tailscale-key.sh (default: openclaw)"}
  - {id: retired-tailscale-env-projection,
     path: .config/coding-system/tailscale.env, mode: "0600", required: false,
     classification: projection, authority: tailscale-authkey-authority,
     portability: regenerated, backup: false,
     feature: "bounded one-time TS_AUTHKEY/TS_HOSTNAME migration input; removed after convergence",
     obtain: "retired — do not recreate"}
  - {id: owner-private-settings,
     path: .secrets.env,           mode: "0600", required: true,
     classification: private-state, portability: portable, backup: true,
     feature: "private owner settings: TELEGRAM_CHAT_ID, MOLTBOOK_* agent config,
       and the non-secret CLASSROOM50_ORG_ALLOWLIST authority. API credentials
       are migrated into bounded dedicated authorities and forbidden here
       (CLASSROOM50_SERVICE_TOKEN is deliberately not restored globally)",
     obtain: "generated from ~/.bashrc by bin/init-private.sh; new user fills template"}
  - {id: sanitized-bashrc-rollback,
     path: .bashrc.pre-coding-system, mode: "0600", required: false,
     classification: private-state, portability: regenerated, backup: false,
     feature: "sanitized rollback copy of the pre-managed bashrc; private assignments and managed loader blocks are removed",
     obtain: "converged by bin/migrate-owner-settings.py without retaining credential values"}
  - {id: sanitized-profile-rollback,
     path: .profile.pre-coding-system, mode: "0600", required: false,
     classification: private-state, portability: regenerated, backup: false,
     feature: "sanitized rollback copy of the pre-managed profile; private assignments and managed loader blocks are removed",
     obtain: "converged by bin/migrate-owner-settings.py without retaining credential values"}
  - {id: retired-npmrc-rollback-copy,
     path: .npmrc.pre-coding-system, mode: "0600", required: false,
     classification: private-state, portability: regenerated, backup: false,
     feature: "retired duplicate npm credential copy; exact duplicates are removed and divergent files fail migration",
     obtain: "retired by bin/migrate-owner-settings.py; do not recreate"}
  - {path: .config/coding-system/leak-denylist.txt, mode: "0600", required: true,
     feature: "leak-scan layer 3 (personal low-entropy IDs)",
     obtain: "seeded by bin/init-private.sh"}
  - {path: .config/coding-system/secrets-meta.json, mode: "0600", required: false,
     classification: private-state, portability: regenerated, backup: false,
     feature: "pack metadata (timestamps, sha256s) for verify", obtain: "generated"}
  - {path: .local/share/coding-system/components/, mode: "0644", required: false,
     classification: private-state, portability: regenerated, backup: false,
     feature: "component checkouts that bin/components.sh makes at the commits pinned in components.lock",
     obtain: "recreated by make restore"}
  - {id: skill-credential-source-contract,
     path: .config/coding-system/skill-credential-source-contract.json,
     mode: "0600", required: true, classification: private-state,
     portability: portable, backup: true, legacy_import: generated,
     feature: "metadata-only inventory of credential capabilities configured at backup time; restore must provide at least the same resolver-reachable closure",
     obtain: "generated by make secrets-pack after the offline credential closure gate"}
  - {path: .config/coding-system/recovery-master.key, mode: "0600", required: false,
     classification: private-state, portability: machine-bound, backup: false,
     feature: "external recovery-set wrapping master; deliberately excluded from its own archive",
     obtain: "recover to a protected file from any two matching escrow shares"}
  - {id: recovery-signing-authority,
     path: .config/coding-system/recovery-signing, mode: "0600", required: true,
     classification: authority, portability: portable, backup: true,
     legacy_import: destination-authority,
     feature: "Ed25519 authority for authenticating recovery-set repository pointers before checkout",
     obtain: "generated once with ssh-keygen; its pinned public key is tracked under system/recovery"}
  - {id: openclaw-owner-backup-passphrase,
     path: .config/coding-system/openclaw-owner-backup-passphrase.txt,
     mode: "0600", required: false,
     classification: authority, portability: portable,
     feature: "passphrase for the separately retained encrypted OpenClaw owner-data archive",
     obtain: "generated by bin/init-private.sh or migrated once from the historical backup password"}
  - {path: .config/coding-system/escrow/, mode: "0600", required: false,
     classification: private-state, portability: machine-bound, backup: false,
     feature: "local escrow share-generation staging; deliberately excluded from recovery sets",
     obtain: "retrieve generation metadata and shares from the escrow locations"}
  - {path: .config/coding-system/zip-password.txt, mode: "0600", required: false,
     classification: private-state, portability: machine-bound, backup: false,
     feature: "legacy-incomplete ZIP password only; never part of the new recovery format",
     obtain: "legacy password manager or old escrow generation"}
  - {path: .config/coding-system/passphrase-share-local.txt, mode: "0600", required: false,
     classification: private-state, portability: machine-bound, backup: false,
     feature: "legacy ZIP escrow share; never archive beside the ciphertext it unlocks",
     obtain: "legacy escrow location"}

  # ---- Forms backup attestation ------------------------------------------
  - {id: forms-backup-attestation-authority,
     path: .local/share/forms-private-keys/forms-backup-attestation-ed25519.pem,
     mode: "0600", required: false, classification: authority,
     portability: portable, backup: true,
     feature: "minimal Ed25519 private signing authority for authenticating Forms private-backup generations",
     obtain: "restore this exact key or deliberately establish and publish a new Forms backup trust root"}
  - {id: forms-backup-attestation-public-state,
     path: .local/share/forms-private-keys/forms-backup-attestation-ed25519-public.pem,
     mode: "0644", required: false, classification: private-state,
     portability: portable, backup: true,
     feature: "non-secret public half of the Forms backup attestation authority",
     obtain: "captured exactly or regenerated from the restored private authority"}
  - {id: forms-backup-attestation-custody-copy,
     path: .local/share/forms-private-keys/forms-backup-attestation-ed25519.pem.gpg,
     mode: "0600", required: false, classification: private-state,
     portability: portable, backup: true,
     feature: "encrypted custody copy of the Forms backup signing authority; exact file only, never the backup-generation tree",
     obtain: "generated by the Forms backup custody workflow"}
  - {id: forms-backup-attestation-lock-state,
     path: .local/share/forms-private-keys/forms-backup-d1.lock,
     mode: "0600", required: false, classification: private-state,
     portability: portable, backup: true,
     feature: "bounded Forms backup generation lock/state marker",
     obtain: "captured from the Forms backup workflow"}
  - {id: forms-backup-recovery-marker,
     path: .local/share/forms-private-keys/forms-backup-recovery-test-v2.json,
     mode: "0600", required: false, classification: private-state,
     portability: portable, backup: true,
     feature: "latest bounded Forms recovery-test marker; generation directories remain outside the recovery manifest",
     obtain: "regenerated by a successful Forms recovery rehearsal"}
  - {id: forms-backup-recovery-marker-signature,
     path: .local/share/forms-private-keys/forms-backup-recovery-test-v2.json.sig,
     mode: "0600", required: false, classification: private-state,
     portability: portable, backup: true,
     feature: "signature over the bounded Forms recovery-test marker",
     obtain: "regenerated with the Forms backup attestation authority"}
  - {path: .local/share/forms-private-keys/account-hard-delete-scope-secret-v1.txt.gpg,
     mode: "0600", required: false, classification: private-state,
     feature: "GPG-encrypted custody copy of the Forms account hard-delete scope secret",
     obtain: "captured; not regenerated"}
  - {path: .local/share/forms-private-keys/admin-local-deletion-secrets-v1.json.gpg,
     mode: "0600", required: false, classification: private-state,
     feature: "GPG-encrypted custody copy of the Forms admin local-deletion secrets",
     obtain: "captured; not regenerated"}

  # ---- Forms checkout-local development authorities ----------------------
  # These files are deliberately ignored by the Forms Git repository. Remote
  # GitHub Actions and Cloudflare secrets remain provider-owned state rather
  # than exportable host files.
  - {id: forms-classroom50-runner-local-authority,
     path: forms/apps/classroom50-runner/.env, mode: "0600", required: false,
     classification: authority, portability: portable, backup: true,
     feature: "Forms Classroom50 runner signing and GitHub authorities plus bounded local runner settings",
     obtain: "restore the local development file or configure the runner explicitly; do not commit it"}
  - {id: forms-api-local-authority,
     path: forms/apps/api/.dev.vars, mode: "0600", required: false,
     classification: authority, portability: portable, backup: true,
     feature: "Forms API local provider and signing authorities",
     obtain: "restore the local development file or reconfigure each provider explicitly; do not commit it"}
  - {id: forms-web-local-private-settings,
     path: forms/apps/web/.env.local, mode: "0600", required: false,
     classification: private-state, portability: portable, backup: true,
     feature: "Forms web local endpoint settings kept distinct from credential authorities",
     obtain: "restore the local development file or recreate the local endpoint settings; do not commit it"}

  # ---- Claude Code --------------------------------------------------------
  - {id: claude-root-private-state,
     path: .claude.json, mode: "0600", required: false,
     classification: private-state, portability: portable, backup: true,
     feature: "Claude Code root metadata: account profile metadata, project trust/state, and nested MCP declarations; OAuth credentials remain in .claude/.credentials.json",
     obtain: "captured from Claude Code; structured discovery checks nested MCP secret fields without rendering values"}
  - {path: .claude/secrets.json,   mode: "0600", required: true,
     feature: "Claude Code legacy/runtime secret authority; bounded values are promoted
       into neutral per-skill authorities so Codex and shared runtimes never depend on it",
     obtain: "per-key table in docs/SECRETS.md"}
  - {path: .claude/.credentials.json, mode: "0600", required: false,
     classification: session, portability: reauth-required,
     feature: "Claude Code OAuth session (re-auth: `claude login`)", obtain: "claude login"}
  - {id: zotero-config-authority,
     path: .config/ai-agents-skills/zotero/config.json, mode: "0644", required: false,
     feature: "target-neutral Zotero library id, WebDAV url, Drive folder, and rename configuration",
     obtain: "promoted from the legacy Claude config or configured per the Zotero skill"}
  - {id: calibre-config-authority,
     path: .config/ai-agents-skills/calibre/config.json, mode: "0644", required: false,
     feature: "target-neutral Calibre Drive library and delivery configuration",
     obtain: "promoted from the legacy Claude config or configured per the Calibre skill"}
  - {id: claude-zotero-config-projection,
     path: .claude/skills/zotero/config.json, mode: "0644", required: false,
     classification: projection, authority: zotero-config-authority,
     portability: regenerated, backup: false,
     feature: "Claude Zotero config projection", obtain: "materialized from the neutral authority"}
  - {id: claude-calibre-config-projection,
     path: .claude/skills/calibre/config.json, mode: "0644", required: false,
     classification: projection, authority: calibre-config-authority,
     portability: regenerated, backup: false,
     feature: "Claude Calibre config projection", obtain: "materialized from the neutral authority"}
  - {path: .local/share/ai-agents-skills/runtime/workspace/config/research-compute.toml,
     mode: "0644", required: false,
     feature: "research_compute broker per-install config ([gha] private-repo targets +
       minute budgets; no tokens — the gh token comes from gh auth). In the zip because it
       names private research repos.",
     obtain: "broker `bootstrap` regenerates a starter from the example; re-add [gha].repos"}
  - {id: openclaw-research-compute-projection,
     path: .openclaw/workspace/config/research-compute.toml, mode: "0600", required: false,
     classification: projection, authority: secret-a7d4540e4f62ab16,
     portability: regenerated, backup: false,
     feature: "OpenClaw-relative research-compute configuration projection",
     obtain: "materialized from the canonical ai-agents-skills research-compute config"}
  - {id: aas-secrets-codex-projection,
     path: .codex/runtime/workspace/.secrets.json, mode: "0600", required: false,
     classification: projection, authority: aas-runtime-secrets-authority,
     portability: regenerated, backup: false,
     feature: "complete bounded AAS_SECRETS_FILE projection for the private Codex runtime",
     obtain: "materialized from the target-neutral AAS secret authority"}
  - {id: aas-secrets-shared-projection,
     path: .local/share/ai-agents-skills/runtime/workspace/.secrets.json, mode: "0600", required: false,
     classification: projection, authority: aas-runtime-secrets-authority,
     portability: regenerated, backup: false,
     feature: "complete bounded AAS_SECRETS_FILE projection for the shared runtime",
     obtain: "materialized from the target-neutral AAS secret authority"}
  - {id: retired-aas-secrets-openclaw-projection,
     path: .openclaw/workspace/.config/ai-agents-skills/secrets.json,
     mode: "0600", required: false, classification: projection,
     authority: aas-runtime-secrets-authority, portability: regenerated, backup: false,
     feature: "retired broad OpenClaw shared-secret projection; classified only
       so old generations are deleted and never archived",
     obtain: "removed during projection convergence; bounded per-reader projections replace it"}
  - {path: .codex/runtime/workspace/.address-book.json, mode: "0600", required: false,
     feature: "send-email address book (saved recipient addresses) for the Codex runtime —
       personal state, restored so saved contacts survive a rebuild.",
     obtain: "accumulated via send --save-recipients / contacts --add"}
  - {path: .local/share/ai-agents-skills/runtime/workspace/.address-book.json, mode: "0600", required: false,
     feature: "send-email address book for the multi-agent runtime root — same role.",
     obtain: "accumulated via send --save-recipients / contacts --add"}
  - {id: openclaw-send-email-address-book,
     path: .openclaw/workspace/.address-book.json, mode: "0600", required: false,
     classification: private-state, portability: portable, backup: true,
     feature: "OpenClaw Send Email saved-recipient address book; owner state restored so sandbox-created contacts survive a rebuild",
     obtain: "accumulated through the OpenClaw send-email contacts and --save-recipients commands"}
  - {id: aas-runtime-secrets-authority,
     path: .config/ai-agents-skills/secrets.json, mode: "0600", required: false,
     feature: "target-neutral bounded shared runtime secrets: Zotero/WebDAV/Drive
       plus the generic Telegram delivery bot; never SMTP, Zulip, compute, provider,
       or env-only skill keys",
     obtain: "promoted key-wise from legacy authorities using the exact shared-reader allowlist"}
  - {id: aas-file-delivery-queue-authority,
     path: .config/ai-agents-skills/file-delivery-queue.json, mode: "0600", required: false,
     classification: authority, portability: portable, backup: true,
     feature: "AAS-native authenticated host queue policy: exact HMAC key, explicit
       channel/target allowlist, bounded job/media/replay limits, and the portable
       fixed replay-ledger token; distinct from OpenClaw's Telegram delivery policy",
     obtain: "create only with an explicit channel/target allowlist; absence means NOT_CONFIGURED"}
  - {id: aas-file-delivery-replay-state,
     path: .local/state/ai-agents-skills/file-delivery-replay/, mode: "0700", required: false,
     classification: private-state, portability: portable, backup: true,
     feature: "AAS host queue replay ledger continuity state; owner-private and outside every agent-writable workspace",
     obtain: "created privately by the credential materializer and restored from the recovery set when present"}
  - {id: aas-compute-authority,
     path: .config/ai-agents-skills/compute.env, mode: "0600", required: false,
     feature: "strict env-only research-compute credentials (HCLOUD_TOKEN,
       HCLOUD_SSH_KEYS, KAGGLE_API_TOKEN, KAGGLE_CONFIG_DIR)",
     obtain: "promoted key-wise from the legacy Claude bundle or configured per compute skill"}
  - {id: aas-skill-secrets-authority,
     path: .config/ai-agents-skills/skill.env, mode: "0600", required: false,
     feature: "strict allowlisted env-only API credentials consumed by individual AAS skills",
     obtain: "promoted without shell evaluation from legacy authorities, including a historical lowercase Zotero Semantic Scholar key, or configured per skill"}
  - {id: aas-provider-secrets-authority,
     path: .config/ai-agents-skills/providers.env, mode: "0600", required: false,
     feature: "strict allowlisted provider API-key fallbacks for autonomous-research-loop child agents, including Kimi",
